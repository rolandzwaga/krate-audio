[package]
name = "krate-manager-helper"
description = "Krate Manager elevated helper: the fixed operation set (Phase 10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "krate-manager-helper"
path = "src/main.rs"
test = false

[features]
# FR-052: never default; only the two elevated CI jobs and the check job's two FR-103a steps enable it
ci-temp-roots = []
# PD-8: the fakes for core's loopback
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
krate-manager-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
