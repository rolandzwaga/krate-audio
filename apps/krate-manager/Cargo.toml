[workspace]
members = ["crates/core", "crates/helper", "src-tauri"]
exclude = ["tests/fixtures/clippy-guard"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
# R-6: core's sysproxy_cf only (macOS)
core-foundation = "0.10.1"
flate2 = "1.1.10"
krate-manager-core = { path = "crates/core" }
log = "0.4.34"
regex = "1.13.1"
# R-8, R-15: default features only, never on Windows (PD-25)
rquickjs = "0.14.0"
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# R-3: the macOS proxy reader in src-tauri
system-configuration = "0.8.0"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.21"
# R-5, PD-2
ureq = { version = "3.5.0", features = ["platform-verifier", "socks-proxy"] }
url = "2.5.8"
# R-2; R-13, R-15: exactly two features, no Win32_System_Time
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
