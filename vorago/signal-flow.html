<text text-anchor="start" x="4100.37" y="-3460.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Control rate:</text>
<text text-anchor="start" x="4184.51" y="-3459.76" font-family="Helvetica,sans-Serif" font-size="10.00">64&#45;sample chunks everywhere (voice, ecosystem, bloom, bodies, cavern); a voice never renders a partial chunk, so the sound does not depend on the host&#39;s block size</text>
<text text-anchor="start" x="4100.37" y="-3440.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Identity layer:</text>
<text text-anchor="start" x="4184.51" y="-3439.76" font-family="Helvetica,sans-Serif" font-size="10.00">the ecosystem and the event schedulers are the authored&#45;nothing core — every wake, bloom and ghost burst is grown, not scripted; they advance even for silent voices</text>
<text text-anchor="start" x="4100.37" y="-3420.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Voice envelope:</text>
<text text-anchor="start" x="4184.51" y="-3419.76" font-family="Helvetica,sans-Serif" font-size="10.00">gates the excitation bus (cloud + noise) only — resonance, ecology, bodies, ghosts and the cavern all ring past note&#45;off; the voice retires on a level detector</text>
<text text-anchor="start" x="4100.37" y="-3400.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Macro matrix:</text>
<text text-anchor="start" x="4184.51" y="-3399.76" font-family="Helvetica,sans-Serif" font-size="10.00">pushed once per block on the audio thread; neutral macros contribute exactly zero; channel aftertouch is added to Pressure</text>
<text text-anchor="start" x="4100.37" y="-3380.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Boundedness:</text>
<text text-anchor="start" x="4184.51" y="-3379.76" font-family="Helvetica,sans-Serif" font-size="10.00">every stochastic process is bounded, mean&#45;reverting and slew&#45;limited; the ecology has an RMS governor; the sub engine a backstop gate; the output a true&#45;peak limiter — a drone left running overnight neither dies nor explodes</text>
<text text-anchor="start" x="4100.37" y="-3360.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Latency:</text>
<text text-anchor="start" x="4184.51" y="-3359.76" font-family="Helvetica,sans-Serif" font-size="10.00">constant — the spectral smear STFT (2048 samples) plus the cavern&#39;s spectral damping; reported once, never re&#45;announced</text>
<text text-anchor="start" x="4100.37" y="-3340.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Chain order:</text>
<text text-anchor="start" x="4184.51" y="-3339.76" font-family="Helvetica,sans-Serif" font-size="10.00">voices → sum → ghost tap → subharmonic → smear → cavern → master gain → saturator → true&#45;peak limiter</text>
<text text-anchor="start" x="4100.37" y="-3320.76" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Seed:</text>
<text text-anchor="start" x="4184.51" y="-3319.76" font-family="Helvetica,sans-Serif" font-size="10.00">one dropdown reseeds every stochastic process (per&#45;voice salts for every source and the identity layer, plus the ghost tap and the cavern); a preset load never reseeds an unchanged seed</text>

    <script type="module">
        const container = document.getElementById("diagram-container");
        const diagramEl = document.getElementById("diagram");
        const loadingEl = document.getElementById("loading");
        const errorEl = document.getElementById("error");
        const zoomLevelEl = document.getElementById("zoom-level");

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        function updateTransform() {
            diagramEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomLevelEl.textContent = Math.round(scale * 100) + "%";
        }

        function fitToScreen() {
            const svg = diagramEl.querySelector("svg");
            if (!svg) return;
            const svgW = svg.viewBox.baseVal.width || svg.width.baseVal.value;
            const svgH = svg.viewBox.baseVal.height || svg.height.baseVal.value;
            const cW = container.clientWidth;
            const cH = container.clientHeight;
            scale = Math.min(cW / svgW, cH / svgH, 1) * 0.95;
            panX = (cW - svgW * scale) / 2;
            panY = (cH - svgH * scale) / 2;
            updateTransform();
        }

        // Zoom controls
        document.getElementById("zoom-in").addEventListener("click", () => {
            scale = Math.min(scale * 1.25, 5);
            updateTransform();
        });
        document.getElementById("zoom-out").addEventListener("click", () => {
            scale = Math.max(scale / 1.25, 0.1);
            updateTransform();
        });
        document.getElementById("zoom-fit").addEventListener("click", fitToScreen);
        document.getElementById("zoom-reset").addEventListener("click", () => {
            scale = 1; panX = 0; panY = 0;
            updateTransform();
        });

        // Mouse wheel zoom
        container.addEventListener("wheel", (e) => {
            e.preventDefault();
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            const newScale = Math.min(Math.max(scale * factor, 0.1), 5);
            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }, { passive: false });

        // Pan with mouse drag
        container.addEventListener("mousedown", (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            container.classList.add("grabbing");
        });
        window.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });
        window.addEventListener("mouseup", () => {
            isDragging = false;
            container.classList.remove("grabbing");
        });

        // Touch support for pan
        let lastTouch = null;
        container.addEventListener("touchstart", (e) => {
            if (e.touches.length === 1) {
                lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        container.addEventListener("touchmove", (e) => {
            if (e.touches.length === 1 && lastTouch) {
                e.preventDefault();
                const dx = e.touches[0].clientX - lastTouch.x;
                const dy = e.touches[0].clientY - lastTouch.y;
                panX += dx;
                panY += dy;
                lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                updateTransform();
            }
        }, { passive: false });
        container.addEventListener("touchend", () => { lastTouch = null; });

        // Render
        const svg = diagramEl.querySelector("svg");
        svg.style.width = "auto";
        svg.style.height = "auto";
        loadingEl.style.display = "none";
        fitToScreen();
    </script>
</body>
</html>
