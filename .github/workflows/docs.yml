name: Deploy Manuals

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/MANUAL.md'
      - 'plugins/*/images/**'
      - 'plugins/*/docs/**'
      - 'plugins/*/version.json'
      - 'docs/**'
      - 'tools/gen-site.js'
      - 'tools/gen-root-index.js'
      - 'tools/generate-signal-flow.js'
      - 'tools/lint-site-seo.js'
      - 'tools/site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Manuals
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # tools/gen-site.js builds every page (landing pages, manuals through pandoc, signal-flow pages pre-rendered with
      # @viz-js/viz from tools/site, root index, sitemap, 404) and refuses to finish unless tools/lint-site-seo.js
      # passes over the output.
      - name: Build Site
        env:
          REPO: ${{ github.repository }}
        run: |
          npm ci --prefix tools/site
          node tools/gen-site.js --out _site
          find _site -type f | sort

      - name: Verify download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying download links in generated pages..."
          FAILED=0

          # Extract all GitHub release download URLs from generated HTML
          mapfile -t URLS < <(grep -roh 'https://github.com/[^"]*releases/download/[^"]*' _site/ | sort -u)

          for url in "${URLS[@]}"; do
            # Decode %2F back to / for the API check
            decoded_url=$(echo "$url" | sed 's/%2F/\//g')
            status=$(curl -s -o /dev/null -w "%{http_code}" -L --head "$decoded_url")
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "  OK ($status): $url"
            else
              echo "  BROKEN ($status): $url"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "::error::Download links are broken! Aborting deployment."
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: ./_site
          keep_files: true
          cname: krateaudio.com
