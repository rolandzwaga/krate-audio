name: Valgrind Nightly

# ============================================================================
# Nightly Valgrind / memcheck run: every plugin's editor-lifecycle cases.
# ============================================================================
# Valgrind costs ~50-80x native, so it runs only the [lifecycle] cases of every
# plugin, where editor-teardown use-after-free bugs live. Every full suite runs
# under AddressSanitizer + UBSan in sanitizers-nightly.yml (~2-3x native).
#
# History: this workflow also ran Membrum's full suite under memcheck
# (--track-origins, 4 shards), added after a global `operator delete` override
# freed a libstdc++-allocated std::string with std::free under
# -fvisibility=hidden. That job was removed on 2026-11-14: hand-rolled
# allocation operator overrides are now blocked at commit time and in CI by
# tools/lint-allocation-operator-overrides.js, and invalid accesses / family
# mismatches in every suite are covered by the sanitizer lane. Lost with it:
# uninitialised-read checks over Membrum's full suite, which no other plugin
# had either.
#
# Why nightly (not per-PR): memcheck's cost and its spurious "uninitialised
# value" reports on SIMD code. Nightly on `main` catches regressions within
# 24 h. Use the manual "Run workflow" button (workflow_dispatch) to run it on
# demand, e.g. before a release.
#
# Change gate: the scheduled run happens only when code it tests changed since
# the last run that actually tested (tools/nightly-change-gate.js, check-activity
# job). Re-running a long memcheck pass over unchanged code buys nothing, so a
# docs, specs or Krate Manager commit costs one cheap job instead of several
# long ones. A manual workflow_dispatch always runs.
# ============================================================================

on:
  schedule:
    # 05:17 UTC daily (off-peak; odd minute avoids the top-of-hour stampede).
    - cron: '17 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: valgrind-nightly
  cancel-in-progress: true

permissions:
  contents: read
  actions: read  # the change gate reads this workflow's previous runs and their jobs

env:
  BUILD_TYPE: Release
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6

jobs:
  # ==========================================================================
  # Skip the scheduled run when no code it tests changed since the last run
  # that actually tested (tools/nightly-change-gate.js; its header has the
  # rules). The paths are what the editor-lifecycle builds compile.
  # workflow_dispatch is never gated: the manual button exists precisely for
  # on-demand runs before a release, when the tree may well be untouched.
  # ==========================================================================
  check-activity:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      # Full history without blobs: enough for `git diff --name-only <last tested commit> HEAD`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did code under test change since the last tested run?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/nightly-change-gate.js --workflow valgrind-nightly.yml -- \
            dsp plugins tests extern cmake CMakeLists.txt CMakePresets.json .github/workflows/valgrind-nightly.yml

  # ==========================================================================
  # Editor open/close lifecycle under memcheck, for ALL plugins.
  # ==========================================================================
  # The shared harness (tests/test_helpers/editor_lifecycle_harness.h) drives
  # each plugin's VST3 editor through repeated IPlugView::attached()/removed()
  # cycles. attached() builds the real view tree from the .uidesc and runs the
  # controller's verifyView/didOpen/willClose delegate hooks -- the exact path
  # where editor-teardown use-after-free bugs live (e.g. a controller that frees
  # a view container and then dynamic_cast's its dangling child pointers).
  #
  # Why memcheck, not plain Release: the dangling read often hits freed-but-not-
  # reused memory, so a normal Release run passes by luck (which is why such
  # crashes only surface in a real DAW). memcheck flags the read of freed memory
  # deterministically.
  #
  # xvfb provides the X display the VSTGUI X11 platform factory needs.
  # --undef-value-errors=no suppresses the noisy "uninitialised value" reports
  # that X11/cairo/fontconfig emit, while keeping the addressability checks
  # (invalid read/write, mismatched free) that actually catch use-after-free.
  # ==========================================================================
  valgrind-editor-lifecycle:
    name: Linux Valgrind (Editor Lifecycle, all plugins)
    runs-on: ubuntu-24.04  # pinned with ci.yml build-linux (compiler determinism)
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Direct apt install, not awalsh128/cache-apt-pkgs-action: the action
      # restored its cache and reported success while /usr/include/X11 was
      # absent (CI build-linux and the Vorago 1.0.0 release both died on
      # "Could NOT find X11").
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            valgrind ninja-build xvfb libx11-dev libxcb1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb-util1 libxcb-util-dev libxcb-keysyms1-dev libxcb-cursor-dev \
            libxcb-xkb-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev
          test -f /usr/include/X11/Xlib.h || { echo "libx11-dev did not install"; exit 1; }

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: linux-valgrind-editor-${{ env.BUILD_TYPE }}
          max-size: ${{ env.CCACHE_MAXSIZE }}

      - name: Cache FetchContent
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-vg-editor/_deps
          key: fetchcontent-${{ github.repository }}-${{ runner.os }}-vgedit-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ github.repository }}-${{ runner.os }}-vgedit-

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build-vg-editor -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all plugin test targets
        run: |
          cmake --build build-vg-editor --parallel --target \
            gradus_tests plugin_tests disrumpo_tests ruinae_tests innexus_tests membrum_tests seraphis_tests vorago_tests profundum_tests

      - name: Run editor-lifecycle tests under Valgrind/memcheck (xvfb)
        timeout-minutes: 60
        run: |
          set -e
          BINDIR="build-vg-editor/bin/${{ env.BUILD_TYPE }}"
          for bin in gradus_tests plugin_tests disrumpo_tests ruinae_tests innexus_tests membrum_tests seraphis_tests vorago_tests profundum_tests; do
            echo "==== $bin [lifecycle] ===="
            test -x "$BINDIR/$bin" || { echo "FAIL: $BINDIR/$bin not found"; exit 1; }
            xvfb-run -a valgrind \
              --tool=memcheck \
              --error-exitcode=99 \
              --leak-check=no \
              --errors-for-leak-kinds=none \
              --undef-value-errors=no \
              --num-callers=25 \
              "$BINDIR/$bin" '[lifecycle]'
          done

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
