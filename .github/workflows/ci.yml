name: CI

on:
  push:
    branches: [main]
    paths:
      - 'dsp/**'
      - 'plugins/**'
      - 'tests/**'
      - 'extern/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dsp/**'
      - 'plugins/**'
      - 'tests/**'
      - 'extern/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ci.yml'
  workflow_call:
    # Allows this workflow to be called by release.yml
    inputs:
      plugin:
        description: 'Plugin to build (empty = all)'
        type: string
        required: false
        default: ''
      long-tests:
        # Run ONLY the [long]-tagged tests (heavy renders excluded from the
        # per-push lane) across every suite on all three OSes. Used by the
        # nightly workflow; per-push runs leave this false and exclude [long].
        type: boolean
        required: false
        default: false

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # ccache settings (used by Linux and macOS builds)
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6

jobs:
  # Detect which parts of the codebase changed to run targeted tests
  # When called via workflow_call (e.g., from release.yml), run all tests
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      dsp: ${{ steps.set-outputs.outputs.dsp }}
      shared: ${{ steps.set-outputs.outputs.shared }}
      iterum: ${{ steps.set-outputs.outputs.iterum }}
      disrumpo: ${{ steps.set-outputs.outputs.disrumpo }}
      ruinae: ${{ steps.set-outputs.outputs.ruinae }}
      innexus: ${{ steps.set-outputs.outputs.innexus }}
      gradus: ${{ steps.set-outputs.outputs.gradus }}
      membrum: ${{ steps.set-outputs.outputs.membrum }}
      seraphis: ${{ steps.set-outputs.outputs.seraphis }}
      vorago: ${{ steps.set-outputs.outputs.vorago }}
      infra: ${{ steps.set-outputs.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect file changes
        # Skipped for release.yml (specific plugin) and for the nightly long-tests
        # call (runs everything; paths-filter has no diff base on a schedule event).
        if: inputs.plugin == '' && !inputs.long-tests
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dsp:
              - 'dsp/**'
            shared:
              - 'plugins/shared/**'
            iterum:
              - 'plugins/iterum/**'
            disrumpo:
              - 'plugins/disrumpo/**'
            ruinae:
              - 'plugins/ruinae/**'
            innexus:
              - 'plugins/innexus/**'
            gradus:
              - 'plugins/gradus/**'
            membrum:
              - 'plugins/membrum/**'
            seraphis:
              - 'plugins/seraphis/**'
            vorago:
              - 'plugins/vorago/**'
            infra:
              - 'tests/**'
              - 'extern/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/ci.yml'

      # Set outputs: use filter results for push/PR, run all for workflow_call
      - name: Set outputs
        id: set-outputs
        run: |
          PLUGIN="${{ inputs.plugin }}"
          if [ "${{ inputs.long-tests }}" = "true" ]; then
            # Nightly long-tests lane: every suite on every OS.
            for area in dsp shared infra iterum disrumpo ruinae innexus gradus membrum seraphis vorago; do
              echo "$area=true" >> $GITHUB_OUTPUT
            done
          elif [ -n "$PLUGIN" ]; then
            # Specific plugin requested (used by release.yml) — only build that plugin
            echo "dsp=false" >> $GITHUB_OUTPUT
            echo "shared=false" >> $GITHUB_OUTPUT
            echo "infra=false" >> $GITHUB_OUTPUT
            for p in iterum disrumpo ruinae innexus gradus membrum seraphis vorago; do
              if [ "$p" = "$PLUGIN" ]; then
                echo "$p=true" >> $GITHUB_OUTPUT
              else
                echo "$p=false" >> $GITHUB_OUTPUT
              fi
            done
          else
            # No plugin specified — use file change detection (push/PR)
            echo "dsp=${{ steps.filter.outputs.dsp }}" >> $GITHUB_OUTPUT
            echo "shared=${{ steps.filter.outputs.shared }}" >> $GITHUB_OUTPUT
            echo "iterum=${{ steps.filter.outputs.iterum }}" >> $GITHUB_OUTPUT
            echo "disrumpo=${{ steps.filter.outputs.disrumpo }}" >> $GITHUB_OUTPUT
            echo "ruinae=${{ steps.filter.outputs.ruinae }}" >> $GITHUB_OUTPUT
            echo "innexus=${{ steps.filter.outputs.innexus }}" >> $GITHUB_OUTPUT
            echo "gradus=${{ steps.filter.outputs.gradus }}" >> $GITHUB_OUTPUT
            echo "membrum=${{ steps.filter.outputs.membrum }}" >> $GITHUB_OUTPUT
            echo "seraphis=${{ steps.filter.outputs.seraphis }}" >> $GITHUB_OUTPUT
            echo "vorago=${{ steps.filter.outputs.vorago }}" >> $GITHUB_OUTPUT
            echo "infra=${{ steps.filter.outputs.infra }}" >> $GITHUB_OUTPUT
          fi

  # Verify the generated architecture indexes are in sync with the source tree,
  # and enforce the deterministic architecture invariants (layer deps, ODR).
  # The indexes are committed artifacts (repo-map, symbols/ODR index, specs index)
  # produced by tools/gen-*.js; this job fails if someone changed the tree without
  # regenerating, or introduced a layer-dependency / duplicate-symbol violation.
  generated-artifacts:
    name: Generated Artifacts In Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check repo-map.json
        run: node tools/gen-repo-map.js --check
      - name: Check symbols.json (ODR index)
        run: node tools/gen-symbols.js --check
      - name: Check specs/INDEX.md
        run: node tools/gen-specs-index.js --check
      # Deterministic architecture-invariant gates (prose rules turned into checks).
      - name: Layer-dependency lint (DSP)
        run: node tools/lint-layers.js
      - name: ODR / duplicate-symbol lint
        run: node tools/lint-odr.js
      # Catches the cross-platform break that only the arm64 leg would find,
      # ~40 min later in the build matrix: a portable krate header included
      # behind an #if defined(__x86_64__)-style guard, while the code using it
      # is unconditional. Compiles on x86, undeclared-identifier on arm64.
      - name: Architecture-guarded include lint
        run: node tools/lint-arch-guarded-includes.js
      # Catches a test that pins a DSP render with a bit-exact digest over the
      # raw float sample bits. That asserts bit-identical floating-point math
      # across MSVC, GCC and Apple Clang (-ffast-math), which cannot hold, so
      # such a test is green only on the machine its digest was generated on.
      - name: Bit-exact float golden lint
        run: node tools/lint-float-bit-goldens.js
      # Same failure mode, one step removed: a captured MIDI dump compared to a
      # golden with a raw string equality. The text looks like bytes, but every
      # sample offset in it is FP math truncated to an integer, so a 1-ULP
      # difference becomes a whole sample. This is how the Ruinae SC-004b
      # goldens went red on Linux and macOS while passing every Windows gate.
      - name: Byte-exact MIDI timing golden lint
        run: node tools/lint-midi-timing-goldens.js
      # Catches a test that names a kPlatformType* constant directly instead of
      # calling Krate::TestSupport::nativePlatformType(). These are plain
      # strings, so the wrong one compiles on every platform and every
      # compile-based gate -- including tools/check-portability.js -- passes.
      # It fails only at runtime: IPlugView::attached() rejects a foreign
      # platform type, so the Linux and macOS legs go red on "1 == 0" roughly
      # 10 minutes in, while every Windows gate was green.
      - name: Hardcoded platform-type constant lint
        run: node tools/lint-platform-type-literals.js
      # Catches a hand-rolled global operator new / delete. A partial or
      # hidden-visibility replacement set corrupts the heap; MSVC never shows
      # it, and on Linux it surfaces as an intermittent SIGSEGV in whatever
      # unrelated test runs later, which never reproduces in isolation. ASan on
      # membrum_tests measured 694,513 alloc-dealloc mismatches from one such
      # partial set, the first during Catch2's static registration.
      - name: Hand-rolled allocation-operator lint
        run: node tools/lint-allocation-operator-overrides.js

      # Catches aligned hn::Load / hn::Store in Highway kernels. With runtime
      # dispatch (ScalableTag) the required alignment is the dispatched vector
      # width -- 64 bytes on AVX-512 -- so alignas(32) buffers fault on the
      # subset of ubuntu runners with AVX-512 hardware. Surfaces as an
      # intermittent Linux-only CI SIGSEGV that never reproduces locally.
      # Regressed once already (c2f76e50 fixed it repo-wide, a perf pass
      # reintroduced it); LoadU/StoreU costs the same on aligned addresses.
      - name: SIMD aligned Load/Store lint
        run: node tools/lint-simd-aligned-loadstore.js

      # Catches std::isnan / std::isinf / numeric_limits::infinity() /
      # quiet_NaN() in files that are NOT built with -fno-fast-math. Under
      # -ffinite-math-only (the macOS leg, and /fp:fast on MSVC) the predicates
      # fold to `false` and the constants fold to finite garbage, so a NaN guard
      # silently disappears and a NaN-injecting test silently stops injecting.
      # Neither is visible on the Windows leg. Gates an explicit list of
      # converted files; run with --all to survey the pre-existing tree-wide
      # debt.
      - name: Non-finite symbol lint (fast-math safety)
        run: node tools/lint-nonfinite-symbols.js

      # Identifiers that compile on Windows and Linux but not on macOS: VSTGUI's
      # platform macros (MAC / WINDOWS / LINUX) used as names, and names at
      # global or anonymous-namespace scope that MacTypes.h also declares
      # (Rect, Point, Style, Size, ...), which turn ambiguous in every TU that
      # includes VSTGUI. Each cost a full macOS build round on 2026-10-09.
      - name: macOS-only name collision lint
        run: node tools/lint-apple-globals.js

  build-windows:
    name: Windows (MSVC)
    # Pinned to windows-2022 (Visual Studio 2022 / MSVC v143). GitHub migrated
    # `windows-latest` to Windows Server 2025 + Visual Studio 2026 (MSVC v144)
    # in June 2026, whose floating-point codegen differs from v143 and breaks
    # this project's bit-exact / tight-margin DSP tests (svf, reverse_buffer,
    # disrumpo, innexus). DSP numerical determinism requires a pinned compiler,
    # so we stay on VS 2022 (GitHub-supported into ~2028) rather than re-tune
    # every numerical tolerance for v144.
    runs-on: windows-2022
    needs: detect-changes
    outputs:
      has-tests: ${{ steps.manifest.outputs.has_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Cache CMake FetchContent downloads
      # Key includes repo name to prevent cache pollution after repo rename
      - name: Cache FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ github.repository }}-${{ runner.os }}-vs-${{ hashFiles('CMakeLists.txt', 'dsp/CMakeLists.txt', 'plugins/shared/CMakeLists.txt', 'plugins/iterum/CMakeLists.txt', 'plugins/disrumpo/CMakeLists.txt', 'plugins/ruinae/CMakeLists.txt', 'plugins/innexus/CMakeLists.txt', 'plugins/gradus/CMakeLists.txt', 'plugins/membrum/CMakeLists.txt', 'plugins/seraphis/CMakeLists.txt', 'plugins/vorago/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ github.repository }}-${{ runner.os }}-vs-

      # Note: sccache/ccache with Ninja causes PDB conflicts with VSTGUI's /Zi flag
      # Visual Studio generator handles PDB files correctly via mspdbsrv.exe
      # VS 2022 generator matches the windows-2022 runner pinned above (see note).
      # KRATE_TEST_PCH: Catch2 + STL precompiled per test executable
      # (cmake/KrateTestPch.cmake). The test TUs are 70 % of this build and
      # nothing can be cached between runs here; measured on dsp_systems_tests
      # at four compile processes: 115 s without, 87 s with.
      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DKRATE_TEST_PCH=ON

      # Build all changed targets in a single cmake invocation.
      # MSBuild's --parallel flag builds independent targets concurrently,
      # avoiding the overhead of re-parsing the solution file per invocation.
      - name: Build All Targets
        shell: bash
        run: |
          TARGETS=""
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          if [ "$DSP" = "true" ] || [ "$INFRA" = "true" ]; then
            TARGETS="$TARGETS dsp_core_tests dsp_primitives_tests dsp_processors_tests dsp_systems_tests dsp_effects_tests"
          fi
          if [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
            TARGETS="$TARGETS shared_tests"
          fi
          for plugin_info in \
            "iterum:Iterum:plugin_tests approval_tests validator" \
            "disrumpo:Disrumpo:disrumpo_tests" \
            "ruinae:Ruinae:ruinae_tests" \
            "innexus:Innexus:innexus_tests" \
            "gradus:Gradus:gradus_tests" \
            "membrum:Membrum:membrum_tests" \
            "seraphis:Seraphis:seraphis_tests" \
            "vorago:Vorago:vorago_tests"; do
            IFS=: read -r key target extras <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              TARGETS="$TARGETS $target $extras"
            fi
          done
          # Build the SDK validator whenever anything is built, so every bundle can be validated.
          case " $TARGETS " in *" validator "*) ;; *) [ -n "$TARGETS" ] && TARGETS="$TARGETS validator" ;; esac
          if [ -n "$TARGETS" ]; then
            echo "Building targets:$TARGETS"
            cmake --build build --config ${{ env.BUILD_TYPE }} --parallel --target $TARGETS
          else
            echo "No targets to build"
          fi

      # The tests run in the test-windows shard jobs at the end of this file (tools/ci-test-shard.js), not
      # here: this job writes the manifest of suites that change detection selected and uploads the test
      # binaries once; the shards download them and each runs its slice. Serial-in-one-job ran 45+ min once
      # the Vorago suites landed (2026-10-09) against a 20-minute cap, and grew with every plugin added.
      - name: Write test manifest
        id: manifest
        shell: bash
        run: |
          BIN="build/bin/${{ env.BUILD_TYPE }}"
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          SUITES=()
          if [ "$DSP" = "true" ] || [ "$INFRA" = "true" ]; then
            SUITES+=(dsp_core_tests dsp_primitives_tests dsp_processors_tests dsp_systems_tests dsp_effects_tests)
          fi
          if [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
            SUITES+=(shared_tests)
          fi
          for plugin_info in \
            "iterum:plugin_tests approval_tests" \
            "disrumpo:disrumpo_tests" \
            "ruinae:ruinae_tests" \
            "innexus:innexus_tests" \
            "gradus:gradus_tests" \
            "membrum:membrum_tests" \
            "seraphis:seraphis_tests" \
            "vorago:vorago_tests"; do
            IFS=: read -r key test_exes <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              for exe in $test_exes; do SUITES+=("$exe"); done
            fi
          done
          : > build/test-manifest.txt
          for suite in "${SUITES[@]}"; do
            test -f "$BIN/$suite.exe" || { echo "::error::$BIN/$suite.exe was selected but not built"; exit 1; }
            echo "$suite" >> build/test-manifest.txt
          done
          echo "Suites for the shard jobs: ${SUITES[*]:-none}"
          echo "has_tests=$([ ${#SUITES[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload test binaries for the shard jobs
        if: steps.manifest.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-bin-windows
          path: |
            build/test-manifest.txt
            build/bin/${{ env.BUILD_TYPE }}/*_tests.exe
          retention-days: 3
          if-no-files-found: error

      - name: Validate + resource-check built bundles
        shell: bash
        run: |
          shopt -s nullglob
          CONFIG="${{ env.BUILD_TYPE }}"
          # Only resource-check bundles for plugins actually built THIS run.
          # `cmake -S . -B build` configures ALL plugins (creating empty bundle
          # skeleton dirs under build/VST3), but change-detection builds only the
          # changed ones. Globbing *.vst3 would drag in stale/never-built bundles
          # whose Resources were never populated and fail the guard — which is
          # exactly what a single-plugin PR did. Mirror the build step's plugin
          # selection so we validate precisely the set we (re)built.
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          BUNDLES=()
          for plugin_info in \
            "iterum:Iterum" "disrumpo:Disrumpo" "ruinae:Ruinae" \
            "innexus:Innexus" "gradus:Gradus" "membrum:Membrum" \
            "seraphis:Seraphis" \
            "vorago:Vorago"; do
            IFS=: read -r key bundle <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              b="build/VST3/$CONFIG/$bundle.vst3"
              [ -d "$b" ] && BUNDLES+=("$b")
            fi
          done
          if [ ${#BUNDLES[@]} -eq 0 ]; then echo "No bundles built — nothing to check"; exit 0; fi
          # Resource guard: every bundle must ship editor.uidesc + moduleinfo.json.
          node tools/check-bundle.js "${BUNDLES[@]}"
          # SDK hosting validator (module load + instantiate + audio-process) on each.
          VALIDATOR="build/bin/$CONFIG/validator.exe"
          if [ -f "$VALIDATOR" ]; then
            for b in "${BUNDLES[@]}"; do echo "Validating $b"; "$VALIDATOR" -e "$b" || exit 1; done
          else
            echo "validator not built this run — ran resource checks only"
          fi

      - name: Upload Iterum Artifact
        if: needs.detect-changes.outputs.iterum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Iterum-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Iterum.vst3
          if-no-files-found: warn

      - name: Upload Disrumpo Artifact
        if: needs.detect-changes.outputs.disrumpo == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Disrumpo-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Disrumpo.vst3
          if-no-files-found: warn

      - name: Upload Ruinae Artifact
        if: needs.detect-changes.outputs.ruinae == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ruinae-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Ruinae.vst3
          if-no-files-found: warn

      - name: Upload Innexus Artifact
        if: needs.detect-changes.outputs.innexus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Innexus-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Innexus.vst3
          if-no-files-found: warn

      - name: Upload Gradus Artifact
        if: needs.detect-changes.outputs.gradus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Gradus-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Gradus.vst3
          if-no-files-found: warn

      - name: Upload Membrum Artifact
        if: needs.detect-changes.outputs.membrum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Membrum-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Membrum.vst3
          if-no-files-found: warn

      - name: Upload Seraphis Artifact
        if: needs.detect-changes.outputs.seraphis == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Seraphis-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Seraphis.vst3
          if-no-files-found: warn

      - name: Upload Vorago Artifact
        if: needs.detect-changes.outputs.vorago == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Vorago-Windows-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Vorago.vst3
          if-no-files-found: warn

  build-macos:
    name: macOS (Clang)
    runs-on: macos-latest
    needs: detect-changes
    outputs:
      has-tests: ${{ steps.manifest.outputs.has_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Install ccache for compiler caching
      - name: Install ccache
        run: brew install ccache

      # Setup ccache with GitHub Actions cache backend
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: macos-xcode-${{ env.BUILD_TYPE }}
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # Cache CMake FetchContent downloads
      # Key includes repo name to prevent cache pollution after repo rename
      - name: Cache FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'dsp/CMakeLists.txt', 'plugins/shared/CMakeLists.txt', 'plugins/iterum/CMakeLists.txt', 'plugins/disrumpo/CMakeLists.txt', 'plugins/ruinae/CMakeLists.txt', 'plugins/innexus/CMakeLists.txt', 'plugins/gradus/CMakeLists.txt', 'plugins/membrum/CMakeLists.txt', 'plugins/seraphis/CMakeLists.txt', 'plugins/vorago/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ github.repository }}-${{ runner.os }}-

      # Use Xcode generator with ccache via TheLartians/Ccache.cmake wrapper scripts
      # This works around Xcode ignoring CMAKE_<LANG>_COMPILER_LAUNCHER
      # Note: PCH stays enabled on macOS - ccache handles it better than sccache
      # Note: SMTG_ENABLE_AUV2_BUILDS enables Audio Unit v2 build via VST3 SDK AU wrapper
      # Note: SMTG_CODE_SIGN_IDENTITY_MAC="-" uses ad-hoc signing (no keychain required in CI)
      # Note: SMTG_DISABLE_CODE_SIGNING=ON works around Xcode 16+ passing -adhoc_codesign
      #        directly to clang++ instead of via -Xlinker (VST3 SDK SMTG_CodeSign.cmake issue).
      #        The SDK's Xcode 15+ post-build codesign workaround still runs independently.
      - name: Configure CMake
        run: cmake -S . -B build -G Xcode -DUSE_CCACHE=ON -DSMTG_ENABLE_AUV2_BUILDS=ON -DSMTG_ENABLE_AUV3_BUILDS=ON -DSMTG_CODE_SIGN_IDENTITY_MAC="-" -DSMTG_DISABLE_CODE_SIGNING=ON

      # Build targets in two phases:
      # Phase 1: VST3 plugins, tests, and AUv3 targets (safe to parallelize)
      # Phase 2: AU v2 targets (built sequentially to avoid AudioUnitSDK
      #          database lock contention — each AU PreBuild script launches
      #          a nested xcodebuild against the same AudioUnitSDK.xcodeproj
      #          SYMROOT, and concurrent access causes SQLite "database is locked")
      - name: Build All Targets
        run: |
          TARGETS=""
          AU_TARGETS=""
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          if [ "$DSP" = "true" ] || [ "$INFRA" = "true" ]; then
            TARGETS="$TARGETS dsp_core_tests dsp_primitives_tests dsp_processors_tests dsp_systems_tests dsp_effects_tests"
          fi
          if [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
            TARGETS="$TARGETS shared_tests"
          fi
          for plugin_info in \
            "iterum:Iterum:Iterum_AU:Iterum_AUV3 plugin_tests approval_tests validator" \
            "disrumpo:Disrumpo:Disrumpo_AU:Disrumpo_AUV3 disrumpo_tests" \
            "ruinae:Ruinae:Ruinae_AU:Ruinae_AUV3 ruinae_tests" \
            "innexus:Innexus:Innexus_AU:Innexus_AUV3 innexus_tests" \
            "gradus:Gradus:Gradus_AU:Gradus_AUV3 gradus_tests" \
            "membrum:Membrum:Membrum_AU:Membrum_AUV3 membrum_tests" \
            "seraphis:Seraphis:Seraphis_AU:Seraphis_AUV3 seraphis_tests" \
            "vorago:Vorago:Vorago_AU:Vorago_AUV3 vorago_tests"; do
            IFS=: read -r key target au_target extras <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              TARGETS="$TARGETS $target $extras"
              AU_TARGETS="$AU_TARGETS $au_target"
            fi
          done
          # Phase 1: Build VST3 plugins, AUv3, and tests in parallel
          if [ -n "$TARGETS" ]; then
            echo "Phase 1 - Building targets (parallel):$TARGETS"
            cmake --build build --config ${{ env.BUILD_TYPE }} --parallel --target $TARGETS
          fi
          # Phase 2: Build AU v2 targets one at a time (avoids AudioUnitSDK DB lock)
          if [ -n "$AU_TARGETS" ]; then
            echo "Phase 2 - Building AU targets (sequential):$AU_TARGETS"
            for au in $AU_TARGETS; do
              echo "  Building $au..."
              cmake --build build --config ${{ env.BUILD_TYPE }} --target $au
            done
          fi
          if [ -z "$TARGETS" ] && [ -z "$AU_TARGETS" ]; then
            echo "No targets to build"
          fi

      # The tests run in the test-macos shard jobs at the end of this file (tools/ci-test-shard.js), not
      # here: this job writes the manifest of suites that change detection selected and uploads the test
      # binaries once; the shards download them and each runs its slice. Serial-in-one-job ran 45+ min once
      # the Vorago suites landed (2026-10-09) against a 20-minute cap, and grew with every plugin added.
      - name: Write test manifest
        id: manifest
        shell: bash
        run: |
          BIN="build/bin/${{ env.BUILD_TYPE }}"
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          SUITES=()
          if [ "$DSP" = "true" ] || [ "$INFRA" = "true" ]; then
            SUITES+=(dsp_core_tests dsp_primitives_tests dsp_processors_tests dsp_systems_tests dsp_effects_tests)
          fi
          if [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
            SUITES+=(shared_tests)
          fi
          for plugin_info in \
            "iterum:plugin_tests approval_tests" \
            "disrumpo:disrumpo_tests" \
            "ruinae:ruinae_tests" \
            "innexus:innexus_tests" \
            "gradus:gradus_tests" \
            "membrum:membrum_tests" \
            "seraphis:seraphis_tests" \
            "vorago:vorago_tests"; do
            IFS=: read -r key test_exes <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              for exe in $test_exes; do SUITES+=("$exe"); done
            fi
          done
          : > build/test-manifest.txt
          for suite in "${SUITES[@]}"; do
            test -f "$BIN/$suite" || { echo "::error::$BIN/$suite was selected but not built"; exit 1; }
            echo "$suite" >> build/test-manifest.txt
          done
          echo "Suites for the shard jobs: ${SUITES[*]:-none}"
          echo "has_tests=$([ ${#SUITES[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload test binaries for the shard jobs
        if: steps.manifest.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-bin-macos
          path: |
            build/test-manifest.txt
            build/bin/${{ env.BUILD_TYPE }}/*_tests
          retention-days: 3
          if-no-files-found: error

      - name: Validate + resource-check built bundles
        shell: bash
        run: |
          shopt -s nullglob
          CONFIG="${{ env.BUILD_TYPE }}"
          # Only resource-check bundles for plugins actually built THIS run.
          # `cmake -S . -B build` configures ALL plugins (creating empty bundle
          # skeleton dirs under build/VST3), but change-detection builds only the
          # changed ones. Globbing *.vst3 would drag in stale/never-built bundles
          # whose Resources were never populated and fail the guard — which is
          # exactly what a single-plugin PR did. Mirror the build step's plugin
          # selection so we validate precisely the set we (re)built.
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          BUNDLES=()
          for plugin_info in \
            "iterum:Iterum" "disrumpo:Disrumpo" "ruinae:Ruinae" \
            "innexus:Innexus" "gradus:Gradus" "membrum:Membrum" \
            "seraphis:Seraphis" \
            "vorago:Vorago"; do
            IFS=: read -r key bundle <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              b="build/VST3/$CONFIG/$bundle.vst3"
              [ -d "$b" ] && BUNDLES+=("$b")
            fi
          done
          if [ ${#BUNDLES[@]} -eq 0 ]; then echo "No bundles built — nothing to check"; exit 0; fi
          # Resource guard: every bundle must ship editor.uidesc + moduleinfo.json.
          node tools/check-bundle.js "${BUNDLES[@]}"
          # SDK hosting validator (module load + instantiate + audio-process) on each.
          VALIDATOR="build/bin/$CONFIG/validator"
          if [ -f "$VALIDATOR" ]; then
            for b in "${BUNDLES[@]}"; do echo "Validating $b"; "$VALIDATOR" -e "$b" || exit 1; done
          else
            echo "validator not built this run — ran resource checks only"
          fi

      # Install AU and run auval validation for Iterum
      - name: Run Iterum AU Validation
        if: needs.detect-changes.outputs.iterum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Iterum.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Iterum.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Itrm KrAt

      # Install AU and run auval validation for Disrumpo
      - name: Run Disrumpo AU Validation
        if: needs.detect-changes.outputs.disrumpo == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Disrumpo.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Disrumpo.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Dsrm KrAt

      # Install AU and run auval validation for Ruinae
      - name: Run Ruinae AU Validation
        if: needs.detect-changes.outputs.ruinae == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Ruinae.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Ruinae.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Ruin KrAt

      # Install AU and run auval validation for Innexus
      - name: Run Innexus AU Validation
        if: needs.detect-changes.outputs.innexus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Innexus.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Innexus.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Innx KrAt

      # Install AU and run auval validation for Gradus
      - name: Run Gradus AU Validation
        if: needs.detect-changes.outputs.gradus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Gradus.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Gradus.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Grad KrAt

      # Install AU and run auval validation for Membrum
      - name: Run Membrum AU Validation
        if: needs.detect-changes.outputs.membrum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Membrum.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Membrum.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Mbrm KrAt

      # Install AU and run auval validation for Seraphis
      - name: Run Seraphis AU Validation
        if: needs.detect-changes.outputs.seraphis == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Seraphis.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Seraphis.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Srph KrAt

      # Install AU and run auval validation for Vorago
      - name: Run Vorago AU Validation
        if: needs.detect-changes.outputs.vorago == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Vorago.component
          cp -R build/VST3/${{ env.BUILD_TYPE }}/Vorago.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Vrgo KrAt

      # Verify AUv3 bundle structure (per-plugin, matching build conditions)
      - name: Verify Iterum AUv3 Bundle
        if: needs.detect-changes.outputs.iterum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Iterum AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Iterum AUv3"; exit 1; }
          echo "[Iterum] AUv3 bundle OK"

      - name: Verify Disrumpo AUv3 Bundle
        if: needs.detect-changes.outputs.disrumpo == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Disrumpo AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Disrumpo AUv3"; exit 1; }
          echo "[Disrumpo] AUv3 bundle OK"

      - name: Verify Ruinae AUv3 Bundle
        if: needs.detect-changes.outputs.ruinae == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Ruinae AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Ruinae AUv3"; exit 1; }
          echo "[Ruinae] AUv3 bundle OK"

      - name: Verify Innexus AUv3 Bundle
        if: needs.detect-changes.outputs.innexus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Innexus AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Innexus AUv3"; exit 1; }
          echo "[Innexus] AUv3 bundle OK"

      - name: Verify Gradus AUv3 Bundle
        if: needs.detect-changes.outputs.gradus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Gradus AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Gradus AUv3"; exit 1; }
          echo "[Gradus] AUv3 bundle OK"

      - name: Verify Membrum AUv3 Bundle
        if: needs.detect-changes.outputs.membrum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Membrum AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Membrum AUv3"; exit 1; }
          echo "[Membrum] AUv3 bundle OK"

      - name: Verify Seraphis AUv3 Bundle
        if: needs.detect-changes.outputs.seraphis == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Seraphis AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Seraphis AUv3"; exit 1; }
          echo "[Seraphis] AUv3 bundle OK"

      - name: Verify Vorago AUv3 Bundle
        if: needs.detect-changes.outputs.vorago == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        run: |
          APP="build/bin/${{ env.BUILD_TYPE }}/Vorago AUv3.app"
          test -d "$APP" || { echo "FAIL: $APP not found"; exit 1; }
          test -d "$APP/Contents/PlugIns" || { echo "FAIL: Missing PlugIns in Vorago AUv3"; exit 1; }
          echo "[Vorago] AUv3 bundle OK"

      # Show ccache statistics for debugging cache effectiveness
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload Iterum Artifacts
        if: needs.detect-changes.outputs.iterum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Iterum-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Iterum.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Iterum.component
            build/bin/${{ env.BUILD_TYPE }}/Iterum AUv3.app
          if-no-files-found: warn

      - name: Upload Disrumpo Artifacts
        if: needs.detect-changes.outputs.disrumpo == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Disrumpo-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Disrumpo.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Disrumpo.component
            build/bin/${{ env.BUILD_TYPE }}/Disrumpo AUv3.app
          if-no-files-found: warn

      - name: Upload Ruinae Artifacts
        if: needs.detect-changes.outputs.ruinae == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ruinae-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Ruinae.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Ruinae.component
            build/bin/${{ env.BUILD_TYPE }}/Ruinae AUv3.app
          if-no-files-found: warn

      - name: Upload Innexus Artifacts
        if: needs.detect-changes.outputs.innexus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Innexus-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Innexus.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Innexus.component
            build/bin/${{ env.BUILD_TYPE }}/Innexus AUv3.app
          if-no-files-found: warn

      - name: Upload Gradus Artifacts
        if: needs.detect-changes.outputs.gradus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Gradus-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Gradus.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Gradus.component
            build/bin/${{ env.BUILD_TYPE }}/Gradus AUv3.app
          if-no-files-found: warn

      - name: Upload Membrum Artifacts
        if: needs.detect-changes.outputs.membrum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Membrum-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Membrum.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Membrum.component
            build/bin/${{ env.BUILD_TYPE }}/Membrum AUv3.app
          if-no-files-found: warn

      - name: Upload Seraphis Artifacts
        if: needs.detect-changes.outputs.seraphis == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Seraphis-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Seraphis.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Seraphis.component
            build/bin/${{ env.BUILD_TYPE }}/Seraphis AUv3.app
          if-no-files-found: warn

      - name: Upload Vorago Artifacts
        if: needs.detect-changes.outputs.vorago == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Vorago-macOS
          path: |
            build/VST3/${{ env.BUILD_TYPE }}/Vorago.vst3
            build/VST3/${{ env.BUILD_TYPE }}/Vorago.component
            build/bin/${{ env.BUILD_TYPE }}/Vorago AUv3.app
          if-no-files-found: warn

  # Linux build (optional per constitution - Platform Support Matrix)
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      has-tests: ${{ steps.manifest.outputs.has_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Installed directly, not through awalsh128/cache-apt-pkgs-action: that
      # action reported success on 2026-10-09 (run 37910949575) while the
      # configure step that followed could not find X11 at all (neither the
      # header nor the library), so nothing it "restored" was on disk. A plain
      # install costs under a minute and cannot silently restore nothing.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build libx11-dev libxcb1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb-util1 libxcb-util-dev libxcb-keysyms1-dev libxcb-cursor-dev \
            libxcb-xkb-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev
          test -f /usr/include/X11/Xlib.h || { echo "libx11-dev did not install"; exit 1; }

      # Cache ccache data
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          key: linux-gcc-${{ env.BUILD_TYPE }}
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # Cache CMake FetchContent downloads
      # Key includes repo name to prevent cache pollution after repo rename
      - name: Cache FetchContent
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: fetchcontent-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'dsp/CMakeLists.txt', 'plugins/shared/CMakeLists.txt', 'plugins/iterum/CMakeLists.txt', 'plugins/disrumpo/CMakeLists.txt', 'plugins/ruinae/CMakeLists.txt', 'plugins/innexus/CMakeLists.txt', 'plugins/gradus/CMakeLists.txt', 'plugins/membrum/CMakeLists.txt', 'plugins/seraphis/CMakeLists.txt', 'plugins/vorago/CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ github.repository }}-${{ runner.os }}-

      # Note: PCH stays enabled on Linux - ccache handles it, and VSTGUI has
      # a missing #include <string> bug that only manifests when PCH is disabled
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Build all changed targets in a single cmake invocation.
      # Ninja already parallelizes compilation, but a single invocation avoids
      # repeated dependency graph evaluation and allows better scheduling.
      - name: Build All Targets
        run: |
          TARGETS=""
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          if [ "$DSP" = "true" ] || [ "$INFRA" = "true" ]; then
            TARGETS="$TARGETS dsp_core_tests dsp_primitives_tests dsp_processors_tests dsp_systems_tests dsp_effects_tests"
          fi
          if [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
            TARGETS="$TARGETS shared_tests"
          fi
          for plugin_info in \
            "iterum:Iterum:plugin_tests approval_tests validator" \
            "disrumpo:Disrumpo:disrumpo_tests" \
            "ruinae:Ruinae:ruinae_tests" \
            "innexus:Innexus:innexus_tests" \
            "gradus:Gradus:gradus_tests" \
            "membrum:Membrum:membrum_tests" \
            "seraphis:Seraphis:seraphis_tests" \
            "vorago:Vorago:vorago_tests"; do
            IFS=: read -r key target extras <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              TARGETS="$TARGETS $target $extras"
            fi
          done
          # Build the SDK validator whenever anything is built, so every bundle can be validated.
          case " $TARGETS " in *" validator "*) ;; *) [ -n "$TARGETS" ] && TARGETS="$TARGETS validator" ;; esac
          if [ -n "$TARGETS" ]; then
            echo "Building targets:$TARGETS"
            cmake --build build --parallel --target $TARGETS
          else
            echo "No targets to build"
          fi

      # The tests run in the test-linux shard jobs at the end of this file (tools/ci-test-shard.js), not
      # here: this job writes the manifest of suites that change detection selected and uploads the test
      # binaries once; the shards download them and each runs its slice. Serial-in-one-job ran 45+ min once
      # the Vorago suites landed (2026-10-09) against a 20-minute cap, and grew with every plugin added.
      - name: Write test manifest
        id: manifest
        shell: bash
        run: |
          BIN="build/bin/${{ env.BUILD_TYPE }}"
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          SUITES=()
          if [ "$DSP" = "true" ] || [ "$INFRA" = "true" ]; then
            SUITES+=(dsp_core_tests dsp_primitives_tests dsp_processors_tests dsp_systems_tests dsp_effects_tests)
          fi
          if [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
            SUITES+=(shared_tests)
          fi
          for plugin_info in \
            "iterum:plugin_tests approval_tests" \
            "disrumpo:disrumpo_tests" \
            "ruinae:ruinae_tests" \
            "innexus:innexus_tests" \
            "gradus:gradus_tests" \
            "membrum:membrum_tests" \
            "seraphis:seraphis_tests" \
            "vorago:vorago_tests"; do
            IFS=: read -r key test_exes <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              for exe in $test_exes; do SUITES+=("$exe"); done
            fi
          done
          : > build/test-manifest.txt
          for suite in "${SUITES[@]}"; do
            test -f "$BIN/$suite" || { echo "::error::$BIN/$suite was selected but not built"; exit 1; }
            echo "$suite" >> build/test-manifest.txt
          done
          echo "Suites for the shard jobs: ${SUITES[*]:-none}"
          echo "has_tests=$([ ${#SUITES[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload test binaries for the shard jobs
        if: steps.manifest.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-bin-linux
          path: |
            build/test-manifest.txt
            build/bin/${{ env.BUILD_TYPE }}/*_tests
          retention-days: 3
          if-no-files-found: error

      - name: Validate + resource-check built bundles
        shell: bash
        run: |
          shopt -s nullglob
          CONFIG="${{ env.BUILD_TYPE }}"
          # Only resource-check bundles for plugins actually built THIS run.
          # `cmake -S . -B build` configures ALL plugins (creating empty bundle
          # skeleton dirs under build/VST3), but change-detection builds only the
          # changed ones. Globbing *.vst3 would drag in stale/never-built bundles
          # whose Resources were never populated and fail the guard — which is
          # exactly what a single-plugin PR did. Mirror the build step's plugin
          # selection so we validate precisely the set we (re)built.
          DSP="${{ needs.detect-changes.outputs.dsp }}"
          SHARED="${{ needs.detect-changes.outputs.shared }}"
          INFRA="${{ needs.detect-changes.outputs.infra }}"
          BUNDLES=()
          for plugin_info in \
            "iterum:Iterum" "disrumpo:Disrumpo" "ruinae:Ruinae" \
            "innexus:Innexus" "gradus:Gradus" "membrum:Membrum" \
            "seraphis:Seraphis" \
            "vorago:Vorago"; do
            IFS=: read -r key bundle <<< "$plugin_info"
            case "$key" in
              iterum)   CHANGED="${{ needs.detect-changes.outputs.iterum }}" ;;
              disrumpo) CHANGED="${{ needs.detect-changes.outputs.disrumpo }}" ;;
              ruinae)   CHANGED="${{ needs.detect-changes.outputs.ruinae }}" ;;
              innexus)  CHANGED="${{ needs.detect-changes.outputs.innexus }}" ;;
              gradus)   CHANGED="${{ needs.detect-changes.outputs.gradus }}" ;;
              membrum)  CHANGED="${{ needs.detect-changes.outputs.membrum }}" ;;
              seraphis) CHANGED="${{ needs.detect-changes.outputs.seraphis }}" ;;
              vorago)   CHANGED="${{ needs.detect-changes.outputs.vorago }}" ;;
            esac
            if [ "$CHANGED" = "true" ] || [ "$DSP" = "true" ] || [ "$SHARED" = "true" ] || [ "$INFRA" = "true" ]; then
              b="build/VST3/$CONFIG/$bundle.vst3"
              [ -d "$b" ] && BUNDLES+=("$b")
            fi
          done
          if [ ${#BUNDLES[@]} -eq 0 ]; then echo "No bundles built — nothing to check"; exit 0; fi
          # Resource guard: every bundle must ship editor.uidesc + moduleinfo.json.
          node tools/check-bundle.js "${BUNDLES[@]}"
          # SDK hosting validator (module load + instantiate + audio-process) on each.
          VALIDATOR="build/bin/$CONFIG/validator"
          if [ -f "$VALIDATOR" ]; then
            for b in "${BUNDLES[@]}"; do echo "Validating $b"; "$VALIDATOR" -e "$b" || exit 1; done
          else
            echo "validator not built this run — ran resource checks only"
          fi

      # Show ccache statistics for debugging cache effectiveness
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Upload Iterum Artifact
        if: needs.detect-changes.outputs.iterum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Iterum-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Iterum.vst3
          if-no-files-found: warn

      - name: Upload Disrumpo Artifact
        if: needs.detect-changes.outputs.disrumpo == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Disrumpo-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Disrumpo.vst3
          if-no-files-found: warn

      - name: Upload Ruinae Artifact
        if: needs.detect-changes.outputs.ruinae == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Ruinae-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Ruinae.vst3
          if-no-files-found: warn

      - name: Upload Innexus Artifact
        if: needs.detect-changes.outputs.innexus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Innexus-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Innexus.vst3
          if-no-files-found: warn

      - name: Upload Gradus Artifact
        if: needs.detect-changes.outputs.gradus == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Gradus-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Gradus.vst3
          if-no-files-found: warn

      - name: Upload Membrum Artifact
        if: needs.detect-changes.outputs.membrum == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Membrum-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Membrum.vst3
          if-no-files-found: warn

      - name: Upload Seraphis Artifact
        if: needs.detect-changes.outputs.seraphis == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Seraphis-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Seraphis.vst3
          if-no-files-found: warn

      - name: Upload Vorago Artifact
        if: needs.detect-changes.outputs.vorago == 'true' || needs.detect-changes.outputs.dsp == 'true' || needs.detect-changes.outputs.shared == 'true' || needs.detect-changes.outputs.infra == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Vorago-Linux-x64
          path: build/VST3/${{ env.BUILD_TYPE }}/Vorago.vst3
          if-no-files-found: warn

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  # ---------------------------------------------------------------------------------------------------------
  # Test shards. Each build job uploads its test binaries once (test-bin-<os>); these matrices run them in
  # parallel slices chosen by tools/ci-test-shard.js from tools/ci-test-times.json. Adding a plugin adds a
  # slice, not minutes. The macOS matrix queues behind the account's 5-concurrent-macOS-job limit.
  # ---------------------------------------------------------------------------------------------------------

  test-windows:
    name: Windows tests (shard ${{ matrix.shard }})
    runs-on: windows-2022
    needs: [detect-changes, build-windows]
    if: needs.build-windows.outputs.has-tests == 'true'
    # Job-level cap: a step that hangs before "Run shard" (artifact download, package install) would
    # otherwise hold the run for GitHub's 6-hour default.
    timeout-minutes: ${{ inputs.long-tests && 200 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # The source tree is needed at run time: the editor-lifecycle tests read resources/editor.uidesc
      # through <PLUGIN>_RESOURCES_DIR, the preset tests read resources/presets, and the DSP suites read
      # their golden files from the tree. No submodules: nothing is compiled here.
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-bin-windows
          path: build
      # One executable at a time inside the shard (see tools/ci-test-shard.js); the parallelism is the matrix.
      - name: Run shard
        shell: bash
        timeout-minutes: ${{ inputs.long-tests && 180 || 60 }}
        run: node tools/ci-test-shard.js --os windows --bin "build/bin/${{ env.BUILD_TYPE }}" --manifest build/test-manifest.txt --shard ${{ matrix.shard }} --count 8 --long "${{ inputs.long-tests }}" --log-dir build/test-logs
      # Failed assertions are also ::error annotations (file, line, test case, expansion); the full output is
      # this artifact, for when the annotations' ten-per-step cap is hit.
      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-windows-${{ matrix.shard }}
          path: build/test-logs/
          retention-days: 7
          if-no-files-found: warn

  test-macos:
    name: macOS tests (shard ${{ matrix.shard }})
    runs-on: macos-latest
    needs: [detect-changes, build-macos]
    if: needs.build-macos.outputs.has-tests == 'true'
    timeout-minutes: ${{ inputs.long-tests && 200 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # The source tree is needed at run time: the editor-lifecycle tests read resources/editor.uidesc
      # through <PLUGIN>_RESOURCES_DIR, the preset tests read resources/presets, and the DSP suites read
      # their golden files from the tree. No submodules: nothing is compiled here.
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-bin-macos
          path: build
      - name: Restore execute bits
        run: chmod +x build/bin/${{ env.BUILD_TYPE }}/*_tests
      # One executable at a time inside the shard (see tools/ci-test-shard.js); the parallelism is the matrix.
      - name: Run shard
        shell: bash
        timeout-minutes: ${{ inputs.long-tests && 180 || 60 }}
        run: node tools/ci-test-shard.js --os macos --bin "build/bin/${{ env.BUILD_TYPE }}" --manifest build/test-manifest.txt --shard ${{ matrix.shard }} --count 8 --long "${{ inputs.long-tests }}" --log-dir build/test-logs
      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-macos-${{ matrix.shard }}
          path: build/test-logs/
          retention-days: 7
          if-no-files-found: warn

  test-linux:
    name: Linux tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [detect-changes, build-linux]
    if: needs.build-linux.outputs.has-tests == 'true'
    timeout-minutes: ${{ inputs.long-tests && 200 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # The source tree is needed at run time: the editor-lifecycle tests read resources/editor.uidesc
      # through <PLUGIN>_RESOURCES_DIR, the preset tests read resources/presets, and the DSP suites read
      # their golden files from the tree. No submodules: nothing is compiled here.
      - name: Checkout
        uses: actions/checkout@v6
      # The test binaries link VSTGUI, so the X11 / cairo / gtkmm runtime libraries must be present to load
      # them; the -dev packages carry those runtime libraries (same list as the build job).
      # Capped and retried: one shard of run 37924744923 sat in this step for hours while the other seven
      # finished it in seconds. The cap turns a hang into a red job that can be re-run; the lock timeout
      # covers the dpkg lock being held by the image's own background apt.
      - name: Install Linux runtime dependencies
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq -o DPkg::Lock::Timeout=120 && \
            sudo apt-get install -y -qq --no-install-recommends -o DPkg::Lock::Timeout=120 \
              libx11-dev libxcb1-dev libxkbcommon-x11-dev libx11-xcb-dev \
              libxcb-util1 libxcb-util-dev libxcb-keysyms1-dev libxcb-cursor-dev \
              libxcb-xkb-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
              libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev && break
            echo "::warning::apt attempt $attempt failed; retrying"
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
      - name: Download test binaries
        uses: actions/download-artifact@v8
        with:
          name: test-bin-linux
          path: build
      - name: Restore execute bits
        run: chmod +x build/bin/${{ env.BUILD_TYPE }}/*_tests
      # One executable at a time inside the shard (see tools/ci-test-shard.js); the parallelism is the matrix.
      - name: Run shard
        shell: bash
        timeout-minutes: ${{ inputs.long-tests && 180 || 60 }}
        run: node tools/ci-test-shard.js --os linux --bin "build/bin/${{ env.BUILD_TYPE }}" --manifest build/test-manifest.txt --shard ${{ matrix.shard }} --count 8 --long "${{ inputs.long-tests }}" --log-dir build/test-logs
      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-linux-${{ matrix.shard }}
          path: build/test-logs/
          retention-days: 7
          if-no-files-found: warn
